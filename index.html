<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch A1.1 — личный тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./style.css?v=grammar-table">
<script defer src="./course.js?v=grammar-basics"></script>
<script defer src="./app.js?v=grammar-table"></script>
<body>
  <main class="layout">
    <div class="masthead">
      <a class="wordmark" href="#home"><span class="swiss-cross" aria-hidden="true"></span> Deutsch<span class="wordmark-level">A1.1</span></a>
      <span class="location">Uznach, Schweiz</span>
    </div>
    <header id="hero"></header>
    <div id="overview">
      <section class="home-modes" aria-label="Режимы занятий">
        <a class="destination destination-main" href="#words">
          <span><strong>Учить слова</strong><small id="due-count"></small></span>
          <span class="menu-arrow" aria-hidden="true"></span>
        </a>
        <a class="destination" href="#uznach">
          <span><strong>День в Уцнахе</strong><small id="uznach-count">Три разговора на немецком</small></span>
          <span class="menu-arrow" aria-hidden="true"></span>
        </a>
      </section>
      <div class="course-progress">
        <span>Прогресс курса</span><strong id="percent"></strong>
      </div>
      <section class="lesson-list" aria-labelledby="lesson-heading">
        <h2 id="lesson-heading">Лекции</h2>
        <nav id="lessons" aria-label="Лекции"></nav>
      </section>
      <a class="destination final-entry" href="#final">
        <span><strong>Итоги A1.1</strong><small id="final-summary">Тест, грамматика и повторение</small></span>
        <span class="menu-arrow" aria-hidden="true"></span>
      </a>
      <details class="panel backup">
        <summary>Резервная копия прогресса</summary>
        <p>Скачай копию, чтобы перенести прогресс в другой браузер или восстановить его позже.</p>
        <div class="actions"><button type="button" id="export-progress">Скачать копию</button></div>
        <label for="backup-file">Файл для восстановления</label>
        <input type="file" id="backup-file" accept=".json,application/json">
        <p id="backup-status" role="status"></p>
        <div class="actions" id="backup-confirm" hidden>
          <button type="button" class="primary" id="restore-progress">Заменить прогресс</button>
        </div>
      </details>
    </div>
    <div id="lesson-view" hidden>
      <nav class="tabs" id="sections" aria-label="Разделы лекции"></nav>
      <section id="content" aria-labelledby="section-title"></section>
      <p id="audio-status" role="status"></p>
    </div>
    <p id="storage-message" role="status"></p>
  </main>
</body>
</html>
